  <script>
    window.dataLayer = window.dataLayer || [];

    function gtag() {
      dataLayer.push(arguments);
    }

    gtag('consent', 'default', {
      ad_storage: 'denied',
      analytics_storage: 'denied',
      ad_user_data: 'denied',
      ad_personalization: 'denied',
      wait_for_update: 500
    });

    try {
      var savedConsent = JSON.parse(localStorage.getItem('cosmed_cookie_consent'));

      if (
        savedConsent &&
        savedConsent.necessary === true &&
        typeof savedConsent.analytics === 'boolean' &&
        typeof savedConsent.advertising === 'boolean'
      ) {
        gtag('consent', 'update', {
          ad_storage: savedConsent.advertising ? 'granted' : 'denied',
          analytics_storage: savedConsent.analytics ? 'granted' : 'denied',
          ad_user_data: savedConsent.advertising ? 'granted' : 'denied',
          ad_personalization: savedConsent.advertising ? 'granted' : 'denied'
        });
      }
    } catch (error) {
      console.warn('Não foi possível restaurar as preferências de cookies.', error);
    }
  </script>
